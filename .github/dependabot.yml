# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
#
# mise tool versions aren't supported: https://github.com/dependabot/dependabot-core/issues/12320
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
