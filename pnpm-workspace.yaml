minimumReleaseAge: 4320 # 3-day release cooldown
packages:
  - "apps/*"
  - "packages/*"
catalog:
  "@types/node": ^24.0.0
  typescript: 7.0.2
  valibot: ^1.5.0
  vite-plus: 1.3.0
  wrangler: ^4.151.0
  yaml: ^2.9.1
catalogMode: strict
cleanupUnusedCatalogs: true
overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.3.0
  vitest@*: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
allowBuilds:
  esbuild: true
  workerd: true
