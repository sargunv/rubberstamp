[settings]
experimental = true
pin = true
minimum_release_age = "3d"
lockfile = true

[tools]
"aqua:dprint/dprint" = "0.63.0"
"aqua:jdx/hk" = "2.7.0"
"aqua:pnpm/pnpm" = "12.14.0"
"core:node" = "24.22.0"
"github:jdx/fnox" = "1.40.0"

[deps.pnpm]
auto = true

[hooks]
postinstall = ["hk install --mise"]

[tasks.check]
description = "Run every formatter and linter in report-only mode."
run = "hk check --all"

[tasks.fix]
description = "Apply every formatter and auto-fixable lint."
run = "hk fix --all"

[tasks.test]
description = "Run the unit tests."
run = "pnpm exec vp test run"

[tasks.verify]
description = "Every check a change must pass before it merges."
depends = ["check", "test"]

[tasks."worker:types"]
description = "Regenerate the Worker's binding types after editing wrangler.jsonc."
dir = "apps/worker"
run = "pnpm exec wrangler types"

[tasks."worker:dev"]
description = "Run the Worker locally on port 8787 with secrets from fnox, against local D1, Durable Objects, and Queues."
dir = "apps/worker"
shell = "bash -c"
run = '''
set -euo pipefail
fnox export --format json |
  node -e 'const { secrets } = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
    secrets.APP_ORIGIN = "http://localhost:5199";
    for (const [k, v] of Object.entries(secrets)) console.log(`${k}=${JSON.stringify(v)}`);' > .dev.vars
mkdir -p ../web/dist
pnpm exec wrangler d1 migrations apply rubberstamp --local
pnpm exec wrangler dev --port 8787
'''

[tasks."web:dev"]
description = "Run the web app on port 5199, proxying the API to the local Worker."
dir = "apps/web"
run = "pnpm exec vp dev --port 5199 --strictPort"

[tasks.dev]
description = "Run the Worker and the web app together. Open http://localhost:5199."
depends = ["worker:dev", "web:dev"]

[tasks.deploy]
description = "Build the web app, create missing queues, migrate D1, and deploy the Worker with its secrets and Cloudflare token from fnox."
dir = "apps/worker"
shell = "bash -c"
run = '''
set -euo pipefail
CLOUDFLARE_API_TOKEN="$(fnox get CLOUDFLARE_API_TOKEN)"
export CLOUDFLARE_API_TOKEN
(cd ../web && pnpm exec vp build)
for queue in rubberstamp-jobs rubberstamp-jobs-dlq; do
  pnpm exec wrangler queues info "$queue" > /dev/null 2>&1 ||
    pnpm exec wrangler queues create "$queue"
done
dir="$(mktemp -d)"
trap 'rm -rf "$dir"' EXIT
secrets="$dir/secrets.json"
fnox export --format json |
  node -e 'process.stdout.write(JSON.stringify(JSON.parse(require("node:fs").readFileSync(0, "utf8")).secrets))' > "$secrets"
deploy() { pnpm exec wrangler deploy --secrets-file "$secrets"; }
migrate() { pnpm exec wrangler d1 migrations apply rubberstamp --remote; }
# The first deploy creates the D1 database, so only then does migrating follow it.
if pnpm exec wrangler d1 info rubberstamp > /dev/null 2>&1; then
  migrate && deploy
else
  deploy && migrate
fi
'''
